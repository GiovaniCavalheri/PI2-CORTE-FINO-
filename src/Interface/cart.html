<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Pedido — Corte Fino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cor-primaria: #e6dcd1;
        --cor-header: rgba(228, 210, 185, 0.55);
        --cor-hero: #87353a;
        --cor-vermelho: #853439;
        --cor-vermelho-escuro: #822b31;
        --cor-vermelho-hover: #ad4c52;
        --cor-bege-claro: #e0cab3;
        --cor-bege-borda: #c2a88c;
        --cor-texto-escuro: #2e1a16;
        --cor-texto-medio: #6a5a50;
        --cor-eventos: #d4b8a0;
        --cor-footer: #5a1e22;
        --cor-background: #fff;
        --font-principal: "Poppins", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-principal);
        background-color: var(--cor-primaria);
        color: var(--cor-texto-escuro);
        min-height: 100vh;
      }

      /* ── HEADER ── */
      header {
        background: var(--cor-header);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--cor-bege-borda);
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .header-logo {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--cor-vermelho);
        text-decoration: none;
        letter-spacing: -0.5px;
      }

      .btn-voltar {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        background: none;
        border: 1.5px solid var(--cor-bege-borda);
        color: var(--cor-texto-medio);
        padding: 0.45rem 1rem;
        border-radius: 8px;
        font-family: var(--font-principal);
        font-size: 0.875rem;
        cursor: pointer;
        transition: all 0.2s;
        text-decoration: none;
      }

      .btn-voltar:hover {
        border-color: var(--cor-vermelho);
        color: var(--cor-vermelho);
      }

      /* ── MAIN LAYOUT ── */
      .container-carrinho {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem;
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 2rem;
        align-items: start;
      }

      @media (max-width: 768px) {
        .container-carrinho {
          grid-template-columns: 1fr;
        }
      }

      /* ── TÍTULO ── */
      .titulo-secao {
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--cor-vermelho);
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      .titulo-secao span.icone {
        font-size: 1.4rem;
      }

      /* ── LISTA DE ITENS ── */
      .lista-itens {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .item-carrinho {
        background: var(--cor-background);
        border: 1px solid var(--cor-bege-borda);
        border-radius: 14px;
        padding: 1rem 1.25rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        animation: fadeSlideIn 0.35s ease both;
      }

      @keyframes fadeSlideIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .item-carrinho img {
        width: 72px;
        height: 72px;
        object-fit: cover;
        border-radius: 10px;
        background: var(--cor-primaria);
        flex-shrink: 0;
      }

      /* fallback quando não há imagem */
      .item-carrinho .img-fallback {
        width: 72px;
        height: 72px;
        border-radius: 10px;
        background: var(--cor-bege-claro);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        flex-shrink: 0;
      }

      .item-info {
        flex: 1;
      }

      .item-categoria {
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--cor-vermelho);
        margin-bottom: 0.15rem;
      }

      .item-nome {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--cor-texto-escuro);
        margin-bottom: 0.15rem;
      }

      .item-preco {
        font-size: 0.85rem;
        color: var(--cor-texto-medio);
      }

      /* controle de quantidade */
      .item-controles {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
      }

      .btn-qtd {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        border: 1.5px solid var(--cor-bege-borda);
        background: var(--cor-primaria);
        color: var(--cor-texto-escuro);
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
        line-height: 1;
      }

      .btn-qtd:hover {
        background: var(--cor-vermelho);
        border-color: var(--cor-vermelho);
        color: #fff;
      }

      .qtd-valor {
        font-size: 0.95rem;
        font-weight: 600;
        min-width: 22px;
        text-align: center;
      }

      .btn-remover {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--cor-bege-borda);
        font-size: 1.1rem;
        padding: 0.25rem;
        margin-left: 0.5rem;
        border-radius: 6px;
        transition: color 0.2s;
        line-height: 1;
      }

      .btn-remover:hover {
        color: var(--cor-vermelho);
      }

      /* ── CARRINHO VAZIO ── */
      .carrinho-vazio {
        text-align: center;
        padding: 4rem 2rem;
        background: var(--cor-background);
        border-radius: 14px;
        border: 1px dashed var(--cor-bege-borda);
      }

      .carrinho-vazio .icone-vazio {
        font-size: 3.5rem;
        margin-bottom: 1rem;
      }

      .carrinho-vazio h3 {
        font-size: 1.1rem;
        color: var(--cor-texto-medio);
        font-weight: 500;
        margin-bottom: 1.5rem;
      }

      .btn-explorar {
        display: inline-block;
        background: var(--cor-vermelho);
        color: #fff;
        padding: 0.7rem 1.6rem;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        transition: background 0.2s;
      }

      .btn-explorar:hover {
        background: var(--cor-vermelho-hover);
      }

      /* ── RESUMO / SIDEBAR ── */
      .resumo-pedido {
        background: var(--cor-background);
        border: 1px solid var(--cor-bege-borda);
        border-radius: 14px;
        padding: 1.75rem;
        position: sticky;
        top: 90px;
      }

      .resumo-titulo {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--cor-texto-escuro);
        margin-bottom: 1.25rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--cor-primaria);
      }

      .resumo-linha {
        display: flex;
        justify-content: space-between;
        font-size: 0.875rem;
        color: var(--cor-texto-medio);
        margin-bottom: 0.6rem;
      }

      .resumo-linha.total {
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--cor-texto-escuro);
        margin-top: 0.75rem;
        padding-top: 0.75rem;
        border-top: 1px solid var(--cor-primaria);
      }

      .resumo-linha.total span:last-child {
        color: var(--cor-vermelho);
      }

      .btn-finalizar {
        width: 100%;
        margin-top: 1.5rem;
        padding: 0.9rem;
        background: var(--cor-vermelho);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-family: var(--font-principal);
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
      }

      .btn-finalizar:hover {
        background: var(--cor-vermelho-hover);
      }

      .btn-finalizar:active {
        transform: scale(0.98);
      }

      .btn-finalizar:disabled {
        background: var(--cor-bege-borda);
        cursor: not-allowed;
      }

      .resumo-info {
        font-size: 0.75rem;
        color: var(--cor-texto-medio);
        text-align: center;
        margin-top: 0.75rem;
        line-height: 1.5;
      }

      /* ── TOAST / NOTIFICAÇÃO ── */
      .toast {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        background: var(--cor-footer);
        color: #fff;
        padding: 0.85rem 1.4rem;
        border-radius: 12px;
        font-size: 0.875rem;
        font-weight: 500;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        opacity: 0;
        transform: translateY(16px);
        transition: all 0.3s ease;
        pointer-events: none;
        z-index: 999;
      }

      .toast.visivel {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <a href="index.html" class="header-logo">Corte Fino</a>
      <a href="index.html" class="btn-voltar">← Continuar comprando</a>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container-carrinho">
      <!-- COLUNA ESQUERDA: lista de itens -->
      <section>
        <h2 class="titulo-secao">
          <span class="icone"></span> Meus Pedido
        </h2>
        <div class="lista-itens" id="lista-itens">
          <!-- itens inseridos pelo JS -->
        </div>
      </section>

      <!-- COLUNA DIREITA: resumo -->
      <aside class="resumo-pedido">
        <h3 class="resumo-titulo">Resumo do Pedido</h3>

        <div class="resumo-linha">
          <span id="resumo-qtd-label">Itens (0)</span>
          <span id="resumo-subtotal">R$ 0,00</span>
        </div>

        <div class="resumo-linha">
          <span>Entrega</span>
          <span style="color: #4a9e6f; font-weight: 600;">Grátis</span>
        </div>

        <div class="resumo-linha total">
          <span>Total</span>
          <span id="resumo-total">R$ 0,00</span>
        </div>

        <button class="btn-finalizar" id="btn-finalizar" disabled>
          Finalizar Pedido
        </button>
        <p class="resumo-info">Pedido mínimo de R$ 30,00 · Pagamento na entrega</p>
      </aside>
    </main>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>

      const CHAVE_CARRINHO = "carrinho_corte_fino";

      function lerCarrinho() {
        const dados = localStorage.getItem(CHAVE_CARRINHO);
        return dados ? JSON.parse(dados) : [];
      }

      function salvarCarrinho(itens) {
        localStorage.setItem(CHAVE_CARRINHO, JSON.stringify(itens));
      }

      function formatarMoeda(valor) {
        return valor.toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL",
        });
      }

      function mudarQuantidade(id, delta) {
        const itens = lerCarrinho();
        const index = itens.findIndex((item) => item.id === id);

        if (index === -1) return;

        itens[index].quantidade += delta;

        if (itens[index].quantidade <= 0) {
          itens.splice(index, 1); // remove o item
        }

        salvarCarrinho(itens);
        renderizarCarrinho();
      }

      function removerItem(id) {
        const itens = lerCarrinho().filter((item) => item.id !== id);
        salvarCarrinho(itens);
        renderizarCarrinho();
        mostrarToast("Item removido do pedido");
      }

      function atualizarResumo(itens) {
        const totalItens = itens.reduce((soma, item) => soma + item.quantidade, 0);
        const subtotal = itens.reduce(
          (soma, item) => soma + item.preco * item.quantidade,
          0
        );

        document.getElementById("resumo-qtd-label").textContent =
          `Itens (${totalItens})`;
        document.getElementById("resumo-subtotal").textContent =
          formatarMoeda(subtotal);
        document.getElementById("resumo-total").textContent =
          formatarMoeda(subtotal);

        const btnFinalizar = document.getElementById("btn-finalizar");
        btnFinalizar.disabled = itens.length === 0;
      }

      function renderizarCarrinho() {
        const itens = lerCarrinho();
        const listaEl = document.getElementById("lista-itens");

        listaEl.innerHTML = "";

        if (itens.length === 0) {
          listaEl.innerHTML = `
            <div class="carrinho-vazio">
              <h3>Seus pedidos estão vazio.<br>Adicione produtos para continuar.</h3>
              <a href="index.html" class="btn-explorar">Ver Produtos</a>
            </div>
          `;
        } else {
          itens.forEach((item, i) => {
            const cardEl = document.createElement("div");
            cardEl.classList.add("item-carrinho");
            cardEl.style.animationDelay = `${i * 0.07}s`;

            const imagemHTML = item.imagem
              ? `<img src="${item.imagem}" alt="${item.nome}" />`
              : `<div class="img-fallback"></div>`;

            cardEl.innerHTML = `
              ${imagemHTML}
              <div class="item-info">
                <div class="item-categoria">${item.categoria}</div>
                <div class="item-nome">${item.nome}</div>
                <div class="item-preco">${formatarMoeda(item.preco)} / kg</div>
              </div>
              <div class="item-controles">
                <button class="btn-qtd" data-id="${item.id}" data-delta="-1">−</button>
                <span class="qtd-valor">${item.quantidade}</span>
                <button class="btn-qtd" data-id="${item.id}" data-delta="1">+</button>
                <button class="btn-remover" data-id="${item.id}" title="Remover">✕</button>
              </div>
            `;

            listaEl.appendChild(cardEl);
          });

          listaEl.querySelectorAll(".btn-qtd").forEach((btn) => {
            btn.addEventListener("click", () => {
              const id = btn.dataset.id;
              const delta = parseInt(btn.dataset.delta);
              mudarQuantidade(id, delta);
            });
          });

          listaEl.querySelectorAll(".btn-remover").forEach((btn) => {
            btn.addEventListener("click", () => {
              removerItem(btn.dataset.id);
            });
          });
        }

        atualizarResumo(itens);
      }

      function mostrarToast(mensagem) {
        const toast = document.getElementById("toast");
        toast.textContent = mensagem;
        toast.classList.add("visivel");
        setTimeout(() => toast.classList.remove("visivel"), 2500);
      }

      document.getElementById("btn-finalizar").addEventListener("click", () => {
        mostrarToast("Pedido enviado! Em breve entraremos em contato.");
        salvarCarrinho([]);
        setTimeout(renderizarCarrinho, 2600);
      });

      // ─────────────────────────────────────────────
      // Inicia a página renderizando o carrinho
      // ─────────────────────────────────────────────
      renderizarCarrinho();
    </script>
  </body>
</html>
